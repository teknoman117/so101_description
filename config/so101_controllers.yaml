controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    # Joint State Broadcaster
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Arm Trajectory Controller
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Gripper Controller
    gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: true

gripper_controller:
  ros__parameters:
    joint: gripper
