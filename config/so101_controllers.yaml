controller_manager:
  ros__parameters:
    update_rate: 50  # Hz

    # Joint State Broadcaster
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    # Arm Trajectory Controller
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    # Gripper Controller
    gripper_controller:
      type: parallel_gripper_action_controller/GripperActionController

arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan
      - shoulder_lift
      - elbow_flex
      - wrist_flex
      - wrist_roll

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    allow_partial_joints_goal: true

    # Start each new trajectory from the last commanded state, not the measured one. The marker
    # follower (lekiwi_teleop arm_marker) replaces its trajectory every cycle; starting each from
    # the measured state, which lags behind on real servos, makes the motion stutter. On
    # activation the controller starts from the hardware's command values, which waveshare_servos
    # seeds with the measured positions.
    interpolate_from_desired_state: true

gripper_controller:
  ros__parameters:
    joint: gripper
